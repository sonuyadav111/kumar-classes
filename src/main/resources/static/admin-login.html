<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Kumar Classes</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #092b50, #1769a6);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 38px;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 20px 50px rgba(0,0,0,.2);
        }

        .brand {
            margin-bottom: 28px;
            text-align: center;
        }

        .brand h1 {
            color: #12345a;
            font-size: 27px;
        }

        .brand p {
            margin-top: 8px;
            color: #64748b;
            font-size: 13px;
        }

        .login-card h2 {
            margin-bottom: 8px;
            color: #12345a;
            font-size: 22px;
        }

        .subtitle {
            margin-bottom: 25px;
            color: #64748b;
            font-size: 13px;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            color: #243b53;
            font-size: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 12px;
            border: 1px solid #dbe4ee;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #1769a6;
            box-shadow: 0 0 0 3px rgba(23,105,166,.12);
        }

        button {
            width: 100%;
            height: 48px;
            margin-top: 24px;
            border: 0;
            border-radius: 8px;
            background: #123b67;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1769a6;
        }

        .error {
            margin-top: 16px;
            color: #dc2626;
            font-size: 13px;
            text-align: center;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            color: #1769a6;
            font-size: 13px;
            text-align: center;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="brand">
            <h1>Kumar Classes</h1>
            <p>Secure Administration Portal</p>
        </div>

        <h2>Admin Login</h2>
        <p class="subtitle">Sign in to manage Kumar Classes.</p>

        <form action="/login" method="post">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter admin username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter admin password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Login to Dashboard</button>
        </form>

        <p class="error" id="loginError" hidden>
            Invalid username or password. Please try again.
        </p>

        <a href="/home.html" class="back-link">
            ← Back to Public Website
        </a>
    </main>

    <script>
        if (new URLSearchParams(window.location.search).has("error")) {
            document.getElementById("loginError").hidden = false;
        }
    </script>
</body>
</html>
